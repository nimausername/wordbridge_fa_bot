# Local-only Postgres. Do not use this file in Coolify.
# Coolify must deploy the Dockerfile application (the bot), not Compose.
services:
  postgres:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: vocab
      POSTGRES_PASSWORD: vocab
      POSTGRES_DB: vocab
    ports:
      - "5432:5432"
    volumes:
      - vocab_pg:/var/lib/postgresql/data

volumes:
  vocab_pg:
